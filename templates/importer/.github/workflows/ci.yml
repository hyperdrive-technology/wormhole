name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, test (unit + conformance), build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager" (pnpm@10.33.2).

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # @wormhole/sdk comes from the committed vendor/*.tgz; the lockfile pins its integrity
      # hash, so a swapped tarball fails here instead of silently changing the SDK.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Includes src/conformance.test.ts: the Wormhole conformance kit, one test per check.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
