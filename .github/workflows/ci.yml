name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager" (pnpm@10.33.2).

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The compile gate (compile-gate.test.ts) needs a Hyperdrive core checkout,
      # which public CI does not have, so it is excluded from `test` and skips
      # itself if run without core.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Proves the out-of-repo path for importer authors: pack @wormhole/sdk as a tarball,
      # install it into a copy of templates/importer outside the workspace, and run the
      # template's typecheck, tests (including the conformance kit) and build.
      - name: Importer template against packed SDK
        run: scripts/verify-template.sh
