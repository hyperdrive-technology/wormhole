# Pre-1.0 CI policy (Des, 2026-11-03): nothing runs automatically (no push/schedule triggers).
# PR jobs run only when the PR has the `ci` label (every push then runs), or on demand with
# `gh workflow run <this file> --ref <branch>` (~/dev/hyperdrive/scripts/ci-run.sh). Minor changes
# are checked locally instead and recorded with ~/dev/hyperdrive/scripts/ci-local-status.sh, which
# also satisfies required checks whose jobs were skipped. Policy: ~/dev/hyperdrive/AGENTS.md.
name: CI

on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci')
    name: typecheck, test, build
    runs-on: boat
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/verify-template.sh installs @wormhole/sdk from this checkout as a git
          # dependency (git+file://...#<HEAD sha>), which needs HEAD's full history.
          fetch-depth: 0

      # "typecheck, test, build" is a required check, so the workflow cannot use `on.paths`
      # (a path-filtered required check never reports and blocks the PR). Instead a PR
      # that changes only Markdown skips the remaining steps; the job still passes.
      # Pushes to main and anything that is not purely *.md run everything; so does a
      # diff that cannot be read (fail closed).
      - name: Does this change touch more than docs?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! changed=$(git diff --no-renames --name-only "$BASE_SHA" HEAD); then
            echo "Could not diff against $BASE_SHA: run everything."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$changed"
          if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '\.md$'; then
            echo "Only Markdown changed: skipping install, tests and build."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.run == 'true'
        # Version comes from package.json "packageManager" (pnpm@12.16.1).

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.scope.outputs.run == 'true'
        run: pnpm typecheck

      # The compile gate (compile-gate.test.ts) needs a Hyperdrive core checkout,
      # which public CI does not have, so it is excluded from `test` and skips
      # itself if run without core.
      - name: Test
        if: steps.scope.outputs.run == 'true'
        run: pnpm test

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: pnpm build

      # Proves the out-of-repo path for importer authors: a copy of templates/importer
      # outside the workspace installs @wormhole/sdk as a pnpm git subdirectory dependency
      # (the same mechanism as github:...#<tag>&path:/packages/sdk) and runs typecheck,
      # tests (including the conformance kit) and build.
      - name: Importer template against packed SDK
        if: steps.scope.outputs.run == 'true'
        run: scripts/verify-template.sh
